name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake lintian
          sudo apt-get install --yes dovecot-dev:${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo apt-get install --yes dovecot-core
            dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.2
          fi

      - name: Install cross-compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXAPS_VERSION=0.0.0
          -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          ${{ matrix.arch == 'arm64' && '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Inspect Debian package
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$package"

      - name: Install and validate (amd64 only)
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          sudo dpkg --install "$package"
          test -f /usr/lib/dovecot/modules/lib25_xaps_imap_plugin.so
          test -f /usr/lib/dovecot/modules/lib25_xaps_push_notification_plugin.so
          test -f /usr/lib/dovecot/modules/settings/libxaps_settings.so
          test -f /etc/dovecot/conf.d/95-xaps.conf
          sudo doveconf -n >/dev/null
