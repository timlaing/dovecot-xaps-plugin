name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes build-essential cmake dovecot-core dovecot-dev
          dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.2

      - name: Configure with warnings as errors
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-Wall -Werror"
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel
