name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test dovecot-${{ matrix.dovecot-major }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [x64, arm64]
        dovecot-major: [2.4, 2.3]
        include:
          - dovecot-major: 2.4
            image: ubuntu:26.04
          - dovecot-major: 2.3
            image: ubuntu:24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for arm64
        if: matrix.name == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Verify inside Ubuntu container
        env:
          PLATFORM: ${{ matrix.name == 'x64' && 'linux/amd64' || 'linux/arm64' }}
          IMAGE: ${{ matrix.image }}
          DOVECOT_MAJOR: ${{ matrix.dovecot-major }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e DOVECOT_MAJOR="$DOVECOT_MAJOR" \
            -v "$PWD":/src -w /src "$IMAGE" \
            /bin/bash -eux -c '
            apt-get update
            apt-get install --yes build-essential cmake dovecot-core dovecot-dev lintian
            version=$(dovecot --version)
            version=${version%% *}
            if [ "$DOVECOT_MAJOR" = "2.4" ]; then
              dpkg --compare-versions "$version" ge 2.4.2
            else
              dpkg --compare-versions "$version" ge 2.3.0
              dpkg --compare-versions "$version" lt 2.4.0
            fi
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DXAPS_VERSION=0.0.0 \
              -DXAPS_DOVECOT_MAJOR="$DOVECOT_MAJOR"
            cmake --build build --parallel
            cpack --config build/CPackConfig.cmake -G DEB -B dist
            package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
            test -n "$package"
            lintian --fail-on error "$package"
            # Capture once; piping `dpkg-deb --contents` straight into `grep -q`
            # races an early grep exit against pipefail as a SIGPIPE failure.
            dpkg-deb --contents "$package" > package-contents.txt
            grep -q 95-xaps.conf package-contents.txt
            if [ "$DOVECOT_MAJOR" = "2.4" ]; then
              grep -q lib25_xaps_imap_plugin.so package-contents.txt
              grep -q lib25_xaps_push_notification_plugin.so package-contents.txt
              grep -q libxaps_settings.so package-contents.txt
            else
              grep -q lib20_xaps_imap_plugin.so package-contents.txt
              grep -q lib20_xaps_push_notification_plugin.so package-contents.txt
              # Explicit check rather than `! grep -q`: errexit ignores a command
              # whose status is inverted with `!`, so the old form passed even
              # when the 2.4-only library leaked into the 2.3 package.
              if grep -q libxaps_settings.so package-contents.txt; then
                echo "Unexpected libxaps_settings.so in Dovecot 2.3 package" >&2
                exit 1
              fi
            fi
            '

  validation-result:
    name: Validate test
    needs:
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation incomplete: ' + ', '.join(failed))
          PY
