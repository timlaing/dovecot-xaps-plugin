name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Dovecot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake dovecot-core dovecot-dev lintian
          dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.2

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXAPS_VERSION=0.0.0

      - name: Build
        run: cmake --build build --parallel

      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Install and validate Debian package
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          lintian --fail-on error "$package"
          sudo apt-get install --yes "./$package"

          test -f /usr/lib/dovecot/modules/lib25_xaps_imap_plugin.so
          test -f /usr/lib/dovecot/modules/lib25_xaps_push_notification_plugin.so
          test -f /usr/lib/dovecot/modules/settings/libxaps_settings.so
          test -f /etc/dovecot/conf.d/95-xaps.conf

          ! grep --fixed-strings --quiet '$mail_plugins' /etc/dovecot/conf.d/95-xaps.conf
          grep --fixed-strings --quiet 'xaps_url = http://[::1]:11619' /etc/dovecot/conf.d/95-xaps.conf
          sudo doveconf -n >/dev/null
