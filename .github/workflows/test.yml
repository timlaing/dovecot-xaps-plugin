name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: linux/amd64
          - name: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU for arm64
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Verify inside Ubuntu 26.04 container
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --platform "$PLATFORM" \
            -v "$PWD":/src -w /src ubuntu:26.04 \
            /bin/bash -eux -c '
            apt-get update
            apt-get install --yes build-essential cmake dovecot-core dovecot-dev lintian
            version=$(dovecot --version)
            version=${version%% *}
            dpkg --compare-versions "$version" ge 2.4.2
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DXAPS_VERSION=0.0.0
            cmake --build build --parallel
            cpack --config build/CPackConfig.cmake -G DEB -B dist
            package=$(find dist -maxdepth 1 -name *.deb -print -quit)
            test -n "$package"
            lintian --fail-on error "$package"
            dpkg-deb --contents "$package" | grep -q lib25_xaps_imap_plugin.so
            dpkg-deb --contents "$package" | grep -q lib25_xaps_push_notification_plugin.so
            dpkg-deb --contents "$package" | grep -q libxaps_settings.so
            dpkg-deb --contents "$package" | grep -q 95-xaps.conf
            '
