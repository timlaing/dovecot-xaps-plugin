name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake gcc dovecot-core dovecot-dev
          dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.2

      - name: Generate compilation database
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Build with test coverage
        run: >-
          cmake -S tests -B build-cov
          -DCMAKE_C_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage &&
          cmake --build build-cov --parallel

      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure

      - name: Generate gcov coverage reports
        run: |
          mkdir -p gcov
          for target in test_xaps_utils test_xaps_push_notification test_xaps_imap; do
            dir="build-cov/CMakeFiles/${target}.dir"
            ( cd "$dir" && gcov -b -c *.gcda >/dev/null )
            mkdir -p "gcov/${target}"
            cp "$dir"/*.gcov "gcov/${target}/"
          done
          python3 scripts/merge-gcov.py --out coverage \
            gcov/test_xaps_utils \
            gcov/test_xaps_push_notification \
            gcov/test_xaps_imap

      - name: Check SonarQube credentials
        id: credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "SONAR_TOKEN is required for main-branch analysis" >&2
            exit 1
          else
            echo "SONAR_TOKEN is unavailable; skipping analysis for this pull request"
          fi

      - name: Run SonarQube Cloud analysis
        if: steps.credentials.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true