name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Debian package
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate release version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install Dovecot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake dovecot-core dovecot-dev lintian
          dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.2

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXAPS_VERSION="${{ env.version }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Inspect Debian package
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$package"
          sudo dpkg --install "$package"
          test -f /usr/lib/dovecot/modules/lib25_xaps_imap_plugin.so
          test -f /usr/lib/dovecot/modules/lib25_xaps_push_notification_plugin.so
          test -f /usr/lib/dovecot/modules/settings/libxaps_settings.so
          test -f /etc/dovecot/conf.d/95-xaps.conf
          sudo doveconf -n >/dev/null

      - name: Generate checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/dovecot-xaps-plugin-${{ env.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dovecot-xaps-plugin-${{ env.version }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dist/*.spdx.json
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release Drafter did not create a draft for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.deb dist/SHA256SUMS dist/*.spdx.json --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --title "$GITHUB_REF_NAME"
