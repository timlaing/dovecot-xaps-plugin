name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate release version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake lintian
          sudo apt-get install --yes dovecot-core:${{ matrix.arch }} dovecot-dev:${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.0
          fi

      - name: Install cross-compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXAPS_VERSION="${{ env.version }}"
          -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          ${{ matrix.arch == 'arm64' && '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Inspect Debian package
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$package"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dovecot-xaps-plugin-${{ env.version }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dovecot-xaps-plugin-*

      - name: Collect Debian packages
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -name '*.deb' -exec cp {} dist/ \;

      - name: Generate checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/dovecot-xaps-plugin.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release Drafter did not create a draft for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.deb dist/SHA256SUMS dist/*.spdx.json --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --title "$GITHUB_REF_NAME"

      - name: Notify APT repository
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        shell: bash
        run: |
          gh api -X POST repos/timlaing/dovecot-xaps-apt/dispatches \
            -f event_type=apt-release \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref_name }}"
