name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build dovecot-${{ matrix.dovecot-major }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container: ${{ matrix.dovecot-major == '2.4' && 'ubuntu:26.04' || 'ubuntu:24.04' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        dovecot-major: [2.4, 2.3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate release version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies (inside container)
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "arm64" ] && [ "${{ matrix.dovecot-major }}" = "2.3" ]; then
            # Ubuntu 24.04 publishes arm64 indexes only on ports.ubuntu.com.
            # Restrict the default archive/security stanzas to amd64 and add
            # an arm64-only ports mirror so dovecot-core/dev:arm64 resolve.
            sed -i '/^URIs:/a\Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-backports noble-security\nComponents: main universe restricted multiverse\nArchitectures: arm64\n' > /etc/apt/sources.list.d/ports.sources
          fi
          apt-get update
          apt-get install --yes build-essential cmake lintian
          apt-get install --yes dovecot-core:${{ matrix.arch }} dovecot-dev:${{ matrix.arch }}
          if [ "${{ matrix.dovecot-major }}" = "2.4" ]; then
            dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.4.0
          else
            dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" ge 2.3.0
            dpkg --compare-versions "$(dovecot --version | awk '{print $1}')" lt 2.4.0
          fi

      - name: Install cross-compiler
        if: matrix.arch == 'arm64'
        run: apt-get install --yes gcc-aarch64-linux-gnu

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DXAPS_VERSION="${{ env.version }}"
          -DXAPS_DOVECOT_MAJOR=${{ matrix.dovecot-major }}
          -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          ${{ matrix.arch == 'arm64' && '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build Debian package
        run: |
          chmod 0644 packaging/conffiles
          cpack --config build/CPackConfig.cmake -G DEB -B dist

      - name: Inspect Debian package
        shell: bash
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          echo "source conffiles mode: $(stat -c '%a' packaging/conffiles)"
          dpkg-deb --ctrl-tarfile "$package" > /tmp/control.tar
          echo "package conffiles mode: $(tar tvf /tmp/control.tar | grep conffiles)"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          lintian --fail-on error "$package"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dovecot-xaps-plugin-${{ env.version }}-dovecot${{ matrix.dovecot-major }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dovecot-xaps-plugin-*

      - name: Collect Debian packages
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -name '*.deb' -exec cp {} dist/ \;

      - name: Generate checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/dovecot-xaps-plugin.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.deb dist/SHA256SUMS dist/*.spdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.deb dist/SHA256SUMS dist/*.spdx.json
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --title "$GITHUB_REF_NAME"

      - name: Notify APT repository
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        shell: bash
        run: |
          gh api -X POST repos/timlaing/dovecot-xaps-apt/dispatches \
            -f event_type=apt-release \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref_name }}"
