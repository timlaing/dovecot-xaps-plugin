name: Feature request
description: Suggest an improvement to the Dovecot XAPS plugin
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case and the outcome you want. Do not include APNS credentials or private mail-server data.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this change solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Additional context
